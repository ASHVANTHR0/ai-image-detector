# Frozen CLIP ViT-B/16 + trained linear head ("linear probe"). Generalizes well to unseen generators because the
# backbone never adapts to the training generators' artifacts (Ojha et al., CVPR 2023, "UnivFD").
name: clip_linear
backbone: vit_base_patch16_clip_224.openai
input_size: 224
batch_size: 32
grad_accum: 1
head_epochs: 15
head_lr: 0.001
epochs: 0          # no full fine-tuning stage
lr: 0.00002
weight_decay: 0.0
warmup_epochs: 0
drop_rate: 0.0
patience: 3
select_metric: roc_auc
seed: 42
num_workers: 4
amp: true
aug:
  crop_scale_min: 0.6
  rotation: 10
  brightness: 0.2
  contrast: 0.2
  jpeg_p: 0.5
  jpeg_quality: [60, 100]
  blur_p: 0.1
