# Baseline transfer-learning config (fits a 6 GB laptop GPU). Any key in scripts/train.py DEFAULTS can be set here.
name: convnext_tiny
backbone: convnext_tiny.fb_in22k_ft_in1k
input_size: 224
batch_size: 32
grad_accum: 1
head_epochs: 2
head_lr: 0.001
epochs: 10
lr: 0.00005
weight_decay: 0.05
warmup_epochs: 1
drop_rate: 0.2
patience: 3
select_metric: roc_auc
seed: 42
num_workers: 4
amp: true
aug:
  crop_scale_min: 0.6
  rotation: 10
  brightness: 0.2
  contrast: 0.2
  jpeg_p: 0.5
  jpeg_quality: [60, 100]
  blur_p: 0.1
